name: Build kids game APK

# Совёнок Уху. Запускается только при изменении файлов игры или общих файлов сборки.
on:
  push:
    branches: ["**"]
    paths:
      - "kidsgame/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "keystore/**"
      - ".github/workflows/build-kids-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :kidsgame:assembleDebug
          cp kidsgame/build/outputs/apk/debug/kidsgame-debug.apk SovenokUhu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SovenokUhu-apk
          path: SovenokUhu.apk
          if-no-files-found: error

      # Детская игра, постоянная ссылка:
      # https://github.com/<owner>/<repo>/releases/download/kids-apk-latest/SovenokUhu.apk
      - name: Publish kids game release
        if: github.ref_name == 'claude/wizardly-lamport-o0mqtg' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' kidsgame/build.gradle.kts)
          gh release delete kids-apk-latest --yes --cleanup-tag || true
          gh release create kids-apk-latest SovenokUhu.apk \
            --target "$GITHUB_SHA" \
            --title "Совёнок Уху $VER — последняя сборка" \
            --notes "Детская игра, версия $VER. Сборка из коммита ${GITHUB_SHA::7}. Скачайте SovenokUhu.apk и установите на Android поверх старой версии." \
            --latest=false

