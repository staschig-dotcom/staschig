name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk GuitarPractice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GuitarPractice-apk
          path: GuitarPractice.apk
          if-no-files-found: error

      # Постоянная ссылка для телефона:
      # https://github.com/<owner>/<repo>/releases/latest/download/GuitarPractice.apk
      - name: Publish to "latest" release
        if: github.ref_name == 'claude/guitar-learning-app-wyjqhf' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest GuitarPractice.apk \
            --target "$GITHUB_SHA" \
            --title "ГитарПрактика — последняя сборка" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Скачайте GuitarPractice.apk и установите на Android." \
            --latest

  # Скриншоты экранов для проверки вёрстки (не релиз приложения).
  screenshots:
    runs-on: ubuntu-latest
    if: github.ref_name == 'claude/guitar-learning-app-wyjqhf'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Render screens
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon recordPaparazziDebug --tests '*ScreenshotTest*'
      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/src/test/snapshots/images
          ls
          gh release delete ui-screenshots --yes --cleanup-tag || true
          gh release create ui-screenshots *.png --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "UI screenshots" --notes "Скриншоты экранов из ${GITHUB_SHA::7} (служебное, для проверки вёрстки)"
