<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таб</title>
<style>
  :root { --bg: #1b1b1f; --panel: #2c2c33; --panel2: #3a3a44; --fg: #eee; --muted: #c9c5ca; --accent: #f4a261; --ok: #90be6d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  button, select, input { font: inherit; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px; background: var(--panel); align-items: center; }
  .bar button { background: var(--panel2); color: var(--fg); border: 0; border-radius: 10px; padding: 6px 10px; min-height: 40px; font-size: 15px; }
  .bar button.on { background: var(--accent); color: #2b1600; }
  .bar button:disabled { opacity: .4; }
  #play { min-width: 64px; font-size: 20px; background: var(--accent); color: #2b1600; }
  .speed { display: flex; align-items: center; gap: 2px; }
  #speedLabel { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  #mixerBtn { flex: 1 1 auto; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 260px; }
  #more { display: none; }
  #more.open { display: flex; }
  #status { padding: 4px 10px; font-size: 13px; color: var(--muted); }
  #status.error { color: #e76f51; }
  #viewport { flex: 1; overflow: auto; background: #fff; }
  #at { color: #000; }
  .at-cursor-bar { background: rgba(244, 162, 97, .18); }
  .at-cursor-beat { background: rgba(231, 111, 81, .85); width: 3px; }
  .at-selection div { background: rgba(142, 202, 230, .35); }
  .at-highlight * { fill: #e76f51; stroke: #e76f51; }

  /* Микшер в стиле Songsterr: выезжающая панель */
  #mixer { position: fixed; inset: auto 0 0 0; max-height: 80%; overflow: auto; background: var(--panel);
    border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.5); padding: 12px 14px 18px; transform: translateY(105%);
    transition: transform .2s ease; z-index: 10; }
  #mixer.open { transform: none; }
  #mixer h3 { margin: 4px 0 8px; font-size: 17px; }
  #mixer .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .presets button { background: var(--panel2); color: var(--fg); border: 0; border-radius: 18px; padding: 8px 12px; min-height: 40px; }
  .presets button.on { background: var(--accent); color: #2b1600; }
  .track { display: grid; grid-template-columns: 34px 1fr auto auto; grid-template-rows: auto auto; gap: 4px 8px; align-items: center;
    padding: 8px; border-radius: 12px; background: #24242a; margin-bottom: 8px; }
  .track.mine { outline: 2px solid var(--accent); }
  .track .icon { font-size: 22px; grid-row: span 2; text-align: center; }
  .track .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track .name small { display: block; font-weight: 400; color: var(--muted); }
  .track button { background: var(--panel2); color: var(--fg); border: 0; border-radius: 8px; min-width: 44px; min-height: 36px; }
  .track button.on { background: var(--accent); color: #2b1600; }
  .track input[type=range] { grid-column: 2 / span 3; width: 100%; accent-color: var(--accent); }
  #closeMixer { width: 100%; margin-top: 6px; background: var(--accent); color: #2b1600; border: 0; border-radius: 12px; min-height: 46px; font-size: 16px; }
</style>
</head>
<body>
<div class="bar">
  <button id="play" disabled title="Играть/пауза">▶</button>
  <button id="stop" disabled title="В начало">⏮</button>
  <span class="speed">
    <button id="slower" title="Медленнее">−</button>
    <span id="speedLabel">100%</span>
    <button id="faster" title="Быстрее">+</button>
  </span>
  <button id="mixerBtn" title="Инструмент и сопровождение">🎸 Инструмент</button>
  <button id="moreBtn" title="Ещё">⋯</button>
</div>
<div class="bar" id="more">
  <button id="metro">Метроном</button>
  <button id="countin">Отсчёт</button>
  <button id="loop" title="Выделите такты пальцем и включите повтор">Повтор</button>
  <button id="view">Ноты+Таб</button>
  <button id="zoomOut">A−</button>
  <button id="zoomIn">A+</button>
</div>
<div id="status">Загрузка…</div>
<div id="viewport"><div id="at"></div></div>

<div id="mixer">
  <h3>Инструмент и сопровождение</h3>
  <p class="hint">Нажмите на дорожку, чтобы видеть её табы — это «ваша партия». Остальные дорожки звучат как сопровождение.</p>
  <div class="presets">
    <button id="presetAll">Все вместе</button>
    <button id="presetBacking">Сопровождение без меня</button>
    <button id="presetSolo">Только моя партия</button>
  </div>
  <div id="trackList"></div>
  <button id="closeMixer">Готово</button>
</div>

<script src="alphaTab.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const status = (text, isError) => {
    $('status').textContent = text;
    $('status').className = isError ? 'error' : '';
    window.__atStatus = { text, isError: !!isError };
  };

  const profiles = ['ScoreTab', 'Tab'];
  let profileIndex = params.get('view') === 'tab' ? 1 : 0;
  let scale = parseFloat(params.get('scale') || '0.9');

  const api = new alphaTab.AlphaTabApi($('at'), {
    core: { fontDirectory: 'font/', useWorkers: true },
    display: { staveProfile: profiles[profileIndex], scale: scale },
    player: {
      playerMode: 'EnabledSynthesizer',
      soundFont: 'soundfont/sonivox.sf2',
      scrollElement: $('viewport'),
      enableCursor: true,
      enableUserInteraction: true,
    },
  });
  window.__api = api;

  // ---------- Микшер (дорожки) ----------
  const mix = { mine: 0, mute: [], solo: [], volume: [] };
  window.__mix = mix;

  function kind(t) {
    const st = t.staves[0];
    if (st.isPercussion) return { icon: '🥁', label: 'ударные' };
    const n = (t.name || '').toLowerCase();
    const strings = st.tuning ? st.tuning.length : 0;
    if (n.includes('bass') || n.includes('бас') || (st.isStringed && strings > 0 && strings <= 5 && st.tuning[0] < 50)) return { icon: '🎸', label: 'бас' };
    if (st.isStringed || strings >= 6) return { icon: '🎸', label: 'гитара' };
    if (n.includes('vocal') || n.includes('voice') || n.includes('вокал')) return { icon: '🎤', label: 'вокал' };
    return { icon: '🎹', label: 'инструмент' };
  }

  function applyMix() {
    const tr = api.score.tracks;
    tr.forEach((t, i) => {
      api.changeTrackMute([t], !!mix.mute[i]);
      api.changeTrackSolo([t], !!mix.solo[i]);
      api.changeTrackVolume([t], mix.volume[i] == null ? 1 : mix.volume[i]);
    });
    const preset = mix.mute[mix.mine] && tr.length > 1 ? 'presetBacking'
      : (mix.solo[mix.mine] && tr.length > 1 ? 'presetSolo' : (!mix.mute.some(Boolean) && !mix.solo.some(Boolean) ? 'presetAll' : ''));
    ['presetAll', 'presetBacking', 'presetSolo'].forEach((id) => $(id).classList.toggle('on', id === preset));
    renderTrackList();
    const t = tr[mix.mine];
    $('mixerBtn').textContent = kind(t).icon + ' ' + (t.name || 'Дорожка ' + (mix.mine + 1)) + (preset === 'presetBacking' ? ' · без меня' : '') + ' ▾';
  }

  function selectMine(i) {
    mix.mine = i;
    api.renderTracks([api.score.tracks[i]]);
    applyMix();
  }

  function renderTrackList() {
    const list = $('trackList');
    list.innerHTML = '';
    api.score.tracks.forEach((t, i) => {
      const k = kind(t);
      const row = document.createElement('div');
      row.className = 'track' + (i === mix.mine ? ' mine' : '');
      row.innerHTML =
        '<div class="icon">' + k.icon + '</div>' +
        '<div class="name">' + (t.name || 'Дорожка ' + (i + 1)) + '<small>' + k.label + (i === mix.mine ? ' · ваша партия' : '') + '</small></div>' +
        '<button class="mute' + (mix.mute[i] ? ' on' : '') + '" title="Заглушить">' + (mix.mute[i] ? '🔇' : '🔊') + '</button>' +
        '<button class="solo' + (mix.solo[i] ? ' on' : '') + '" title="Только эта дорожка">S</button>' +
        '<input type="range" min="0" max="2" step="0.1" value="' + (mix.volume[i] == null ? 1 : mix.volume[i]) + '">';
      row.querySelector('.name').onclick = () => selectMine(i);
      row.querySelector('.icon').onclick = () => selectMine(i);
      row.querySelector('.mute').onclick = () => { mix.mute[i] = !mix.mute[i]; applyMix(); };
      row.querySelector('.solo').onclick = () => { mix.solo[i] = !mix.solo[i]; applyMix(); };
      row.querySelector('input').oninput = (e) => { mix.volume[i] = +e.target.value; api.changeTrackVolume([t], mix.volume[i]); };
      list.appendChild(row);
    });
  }

  $('presetAll').onclick = () => { mix.mute = []; mix.solo = []; applyMix(); };
  $('presetBacking').onclick = () => { mix.solo = []; mix.mute = []; mix.mute[mix.mine] = true; applyMix(); };
  $('presetSolo').onclick = () => { mix.mute = []; mix.solo = []; mix.solo[mix.mine] = true; applyMix(); };
  $('mixerBtn').onclick = () => $('mixer').classList.add('open');
  $('closeMixer').onclick = () => $('mixer').classList.remove('open');
  $('moreBtn').onclick = () => { $('more').classList.toggle('open'); $('moreBtn').classList.toggle('on'); };

  // ---------- Загрузка ----------
  api.error.on((e) => status('Не удалось открыть: ' + (e && e.message ? e.message : e), true));
  api.scoreLoaded.on((score) => {
    // «Моя партия» по умолчанию — первая гитарная дорожка (или ?track=).
    const wanted = params.get('track');
    let mine = wanted != null && score.tracks[+wanted] ? +wanted
      : score.tracks.findIndex((t) => t.staves.some((s) => !s.isPercussion && (s.isStringed || (s.tuning && s.tuning.length >= 6))));
    if (mine < 0) mine = 0;
    mix.mine = mine;
    if (mine > 0) api.renderTracks([score.tracks[mine]]);
    $('mixerBtn').style.display = '';
    applyMix();
    if (score.tracks.length < 2) {
      $('presetBacking').disabled = true; $('presetSolo').disabled = true;
    }
    const title = [score.artist, score.title].filter(Boolean).join(' — ');
    window.__atTitle = (title || 'Таб') + ' · ' + score.tempo + ' BPM' + (score.tracks.length > 1 ? ' · дорожек: ' + score.tracks.length : '');
    status(window.__atTitle + (api.isReadyForPlayback ? '' : ' · загрузка звука…'));
    window.__atLoaded = true;
  });
  api.renderFinished.on(() => { window.__atRendered = true; });
  api.playerReady.on(() => {
    $('play').disabled = false; $('stop').disabled = false;
    if (api.score) applyMix(); // синтезатор готов — применяем громкости/заглушения
    status(window.__atTitle || 'Готово');
    window.__atPlayerReady = true;
  });
  api.playerStateChanged.on((e) => { $('play').textContent = e.state === 1 ? '❚❚' : '▶'; });

  $('play').onclick = () => api.playPause();
  $('stop').onclick = () => api.stop();

  const speeds = [0.25, 0.4, 0.5, 0.6, 0.7, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5];
  let speedIndex = speeds.indexOf(1);
  const applySpeed = () => { api.playbackSpeed = speeds[speedIndex]; $('speedLabel').textContent = Math.round(speeds[speedIndex] * 100) + '%'; };
  $('slower').onclick = () => { speedIndex = Math.max(0, speedIndex - 1); applySpeed(); };
  $('faster').onclick = () => { speedIndex = Math.min(speeds.length - 1, speedIndex + 1); applySpeed(); };
  const initialSpeed = parseFloat(params.get('speed') || '1');
  speedIndex = speeds.reduce((best, s, i) => Math.abs(s - initialSpeed) < Math.abs(speeds[best] - initialSpeed) ? i : best, 0);
  applySpeed();

  const toggle = (id, get, set) => { $(id).onclick = () => { set(!get()); $(id).classList.toggle('on', get()); }; };
  toggle('metro', () => api.metronomeVolume > 0, (v) => api.metronomeVolume = v ? 1 : 0);
  toggle('countin', () => api.countInVolume > 0, (v) => api.countInVolume = v ? 1 : 0);
  toggle('loop', () => api.isLooping, (v) => api.isLooping = v);

  const rerender = () => { api.settings.display.staveProfile = profiles[profileIndex]; api.settings.display.scale = scale; api.updateSettings(); api.render(); };
  $('view').textContent = profileIndex === 0 ? 'Ноты+Таб' : 'Только таб';
  $('view').onclick = () => { profileIndex = 1 - profileIndex; $('view').textContent = profileIndex === 0 ? 'Ноты+Таб' : 'Только таб'; rerender(); };
  $('zoomIn').onclick = () => { scale = Math.min(2, scale + 0.15); rerender(); };
  $('zoomOut').onclick = () => { scale = Math.max(0.5, scale - 0.15); rerender(); };

  // Источник: ?file=<url файла GP/MusicXML> или ?tex=<url alphaTex-файла>.
  const file = params.get('file');
  const tex = params.get('tex');
  const fail = (e) => status('Не удалось загрузить файл: ' + e, true);
  if (file) {
    fetch(file).then((r) => { if (!r.ok) throw r.status; return r.arrayBuffer(); })
      .then((buf) => api.load(new Uint8Array(buf))).catch(fail);
  } else if (tex) {
    fetch(tex).then((r) => { if (!r.ok) throw r.status; return r.text(); })
      .then((t) => api.tex(t)).catch(fail);
  } else {
    status('Файл не указан', true);
  }
})();
</script>
</body>
</html>
